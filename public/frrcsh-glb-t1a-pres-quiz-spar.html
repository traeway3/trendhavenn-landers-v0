<!--
  frrcsh-glb-t1a-pres-quiz-spar.html
  Freecash — Prescott, Tier 1A, GLOBAL offer link — Spartis bot launch, no prelander.
  No Carrd short code in this file: the bot writes the Carrd -> lander /r mapping.

  Design is a 1:1 rebuild of https://free-cashh.vercel.app (a Next.js/v0 app) as one static
  file: the same splash -> 3-question quiz -> estimate result flow, same markup and class
  names, same copy, same CSS values, same animations, same beacon chain
  (load / human / start / q1 / q2 / q3 / result / claim / continue).

  Differences, all of them plumbing rather than design:
    1. OUTBOUND. The reference fires buenohoodies.com/c/freecashprescott and forwards the
       ENTIRE inbound query string. This one fires the documented Freecash Prescott short
       code and sends campid only — an inbound empty sub param riding along to the network
       is the "empty param wins" bug that has cost this account conversions three times.
    2. BEACON TAG. The reference still reports as "gp-quiz", the Gravy Pass quiz tag, so its
       numbers land on top of that page's. This one has its own.
    3. ASSETS. The reference loads /tiktok.svg and /testerup-logo.png (the file name is
       misleading — the image it serves is the Freecash mark). Both are inlined here: the
       TikTok glyph as the reference's own SVG, the Freecash mark straight out of
       frrcsh-glb-t1a-pres-bb-spar.html. Zero external image requests.
    4. MOBILE. The reference ships one max-width:374px rule. The ladder here adds 360px,
       344px and a short-viewport rule, and nothing else moved.

  NO on-load kicker. The reference's JS bundle contains no breakout of any kind — no
  x-safari-, no intent://, no UA test, no sessionStorage guard — so this page carries none
  either. Bot launch: the Carrd /r cloaker is the front and this page is selected in the
  Spartis LANDERS tab.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --background:#0b0f0d; --foreground:#f2f5f3; --card:#141a18; --line:#232b28;
  --mint:#6de6a9; --mint2:#3fbf83; --ink:#04231a; --mut:#8b9a93;
  --gold:#ffc107; --timer:#ff9e6b;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;border:0 solid;-webkit-tap-highlight-color:transparent}
html{
  -webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;line-height:1.5;
  font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
body{
  background:var(--background);color:var(--foreground);overflow-x:clip;
  overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  -webkit-user-select:none;user-select:none;
}
h1,h2,h3,h4{font-size:inherit;font-weight:inherit}
b,strong{font-weight:bolder}
img,svg{display:block;vertical-align:middle;max-width:100%;height:auto}
button{font:inherit;letter-spacing:inherit;color:inherit;background:transparent;border-radius:0;-webkit-appearance:button;appearance:button}

/* the drifting mint wash behind everything */
.bg{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 70% 45% at 50% -5%,#6de6a924,transparent 65%),
    radial-gradient(ellipse 45% 35% at 100% 100%,#3fbf8312,transparent 60%),
    var(--background);
  animation:drift 16s ease-in-out infinite;
}
@keyframes drift{0%,100%{transform:scale(1)}50%{transform:scale(1.06) translateY(-8px)}}

/* six mint motes rising the height of the screen on staggered loops */
.sparks{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sparks i{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;background:var(--mint);opacity:0;animation:up linear infinite}
@keyframes up{
  0%{opacity:0;transform:translateY(0) scale(.6)}
  12%{opacity:.45}
  70%{opacity:.28}
  100%{opacity:0;transform:translateY(-104vh) scale(1.1)}
}

.wrap{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:22px 18px calc(30px + env(safe-area-inset-bottom,0px))}
.anim{opacity:0;animation:fade .5s ease forwards}
@keyframes fade{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:translateY(0)}}

.brand{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:20px}
.brand img{width:46px;height:46px;border-radius:13px;object-fit:cover;box-shadow:0 0 22px rgba(109,230,169,.3);animation:glow 3.2s ease-in-out infinite}
@keyframes glow{
  0%,100%{box-shadow:0 0 18px rgba(109,230,169,.22)}
  50%{box-shadow:0 0 34px rgba(109,230,169,.46)}
}
.brand .x{color:rgba(255,255,255,.4);font-size:18px}
.brand .nm{font-size:19px;font-weight:800;letter-spacing:-.02em}

h1{font-size:31px;font-weight:900;line-height:1.12;letter-spacing:-.9px;text-align:center;text-wrap:balance;margin-bottom:12px}
h1 .hl{color:var(--mint)}
.sub{font-size:14px;line-height:1.55;color:var(--mut);text-align:center;text-wrap:pretty;margin-bottom:20px}

.stats{display:flex;gap:9px;margin-bottom:20px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 6px;text-align:center}
.stat b{display:flex;justify-content:center;align-items:center;gap:2px;font-size:16px;font-weight:900;color:var(--mint)}
.stat .star{display:block;flex-shrink:0}
.stat span{font-size:10.5px;letter-spacing:.02em;color:var(--mut)}

.cta-wrap{width:100%}
.cta{
  display:block;width:100%;min-height:58px;padding:18px;border:none;border-radius:15px;
  background:linear-gradient(180deg,var(--mint),var(--mint2));color:var(--ink);
  font-family:inherit;font-size:16.5px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;
  text-align:center;cursor:pointer;transition:transform .15s;
  animation:pulse 2.4s ease-in-out infinite;
  box-shadow:0 0 28px rgba(109,230,169,.42),0 4px 16px rgba(0,0,0,.35);
}
@keyframes pulse{50%{opacity:.5}}
.cta:active{transform:scale(.98)}

.sec-h{margin:26px 0 13px;font-size:11px;font-weight:800;letter-spacing:.2em;color:rgba(255,255,255,.45);text-align:center}
.steps{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px 16px}
.stp{display:flex;gap:13px;padding-bottom:16px;position:relative}
.stp:not(:last-child)::after{content:'';position:absolute;top:29px;bottom:0;left:13px;width:2px;background:var(--line)}
.stp:last-child{padding-bottom:0}
.stp .n{flex-shrink:0;z-index:1;display:flex;justify-content:center;align-items:center;width:27px;height:27px;border-radius:50%;background:var(--mint);color:var(--ink);font-size:12.5px;font-weight:900}
.stp h4{font-size:14px;font-weight:700;margin-bottom:3px}
.stp p{font-size:12px;line-height:1.45;color:var(--mut)}
.stp p b{color:var(--mint);font-weight:600}

.act{position:relative;margin-top:18px;padding:17px 15px;border:1px solid rgba(255,193,7,.4);border-radius:15px;background:rgba(255,193,7,.06)}
.act .flag{position:absolute;top:-10px;left:14px;padding:4px 9px;border-radius:6px;background:var(--gold);color:#241c00;font-size:9.5px;font-weight:900;letter-spacing:.08em}
.act h4{margin:4px 0 6px;font-size:14.5px;font-weight:800}
.act p{font-size:12.5px;line-height:1.5;color:rgba(255,255,255,.6)}
.act p b{color:var(--mint);font-weight:700}
.trust{margin-top:16px;font-size:11.5px;line-height:1.45;color:rgba(255,255,255,.32);text-align:center}

/* ---- quiz ---- */
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.qstep{font-size:10.5px;font-weight:800;letter-spacing:.16em;color:var(--mut)}
.qtally{font-size:17px;font-weight:900;color:var(--mint);font-variant-numeric:tabular-nums}
.qbar{height:5px;margin-bottom:22px;border-radius:999px;background:#1c2321;overflow:hidden}
.qbar i{display:block;width:0;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--mint),var(--mint2));transition:width .45s cubic-bezier(.22,1,.36,1)}
.q h2{font-size:22px;font-weight:900;line-height:1.2;letter-spacing:-.5px;text-align:center;text-wrap:balance;margin-bottom:16px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  width:100%;min-height:56px;padding:16px;border:1.5px solid var(--line);border-radius:13px;
  background:var(--card);color:var(--foreground);font-family:inherit;font-size:14.5px;font-weight:700;
  text-align:left;cursor:pointer;transition:border-color .15s,background .15s,transform .12s;
}
.opt:active{transform:scale(.985)}
.opt.sel{border-color:var(--mint);background:rgba(109,230,169,.1)}

/* ---- result ---- */
.badge{display:flex;justify-content:center;align-items:center;gap:7px;width:fit-content;margin:0 auto 16px;padding:8px 15px;border:1px solid rgba(109,230,169,.34);border-radius:999px;background:rgba(109,230,169,.1);color:var(--mint);font-size:12px;font-weight:800}
.badge .dot{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint);animation:bl 1.7s ease-in-out infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.3}}
.est{margin-bottom:16px;padding:22px 18px;border:1px solid rgba(109,230,169,.3);border-radius:17px;background:var(--card);text-align:center}
.est .lbl{margin-bottom:8px;font-size:10.5px;font-weight:800;letter-spacing:.16em;color:var(--mut)}
.est .big{font-size:39px;font-weight:900;line-height:1;letter-spacing:-1.6px;color:var(--mint);font-variant-numeric:tabular-nums}
.est .cap{margin-top:9px;font-size:11.5px;color:var(--mut)}
.timer{display:flex;justify-content:center;align-items:center;gap:7px;margin-bottom:16px;font-size:12.5px;font-weight:700;color:var(--timer)}
.timer b{font-variant-numeric:tabular-nums;font-weight:900}
.live{margin-top:13px;font-size:12px;color:var(--mut);text-align:center}
.live b{color:var(--mint);font-weight:700}
.fine{margin-top:11px;font-size:11px;color:rgba(255,255,255,.3);text-align:center}

/* ---- 21+ tip ---- */
.tip-overlay{position:fixed;inset:0;z-index:50;display:flex;justify-content:center;align-items:center;padding:22px;background:rgba(0,0,0,.66);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);animation:tip-fade .2s ease forwards}
@keyframes tip-fade{0%{opacity:0}100%{opacity:1}}
.tip-card{position:relative;width:100%;max-width:380px;padding:26px 22px 22px;border:1px solid var(--line);border-radius:22px;background:#1a201e;box-shadow:0 24px 60px rgba(0,0,0,.5);animation:tip-pop .24s cubic-bezier(.22,1,.36,1) forwards}
@keyframes tip-pop{0%{opacity:0;transform:translateY(14px) scale(.96)}100%{opacity:1;transform:translateY(0) scale(1)}}
.tip-close{position:absolute;top:16px;right:16px;display:flex;justify-content:center;align-items:center;width:26px;height:26px;border:none;background:0 0;color:rgba(255,255,255,.5);cursor:pointer}
.tip-eyebrow{margin-bottom:12px;font-size:12px;font-weight:800;letter-spacing:.18em;color:var(--mut);text-align:center}
.tip-title{margin-bottom:14px;font-size:27px;font-weight:900;line-height:1.12;letter-spacing:-.8px;text-align:center;text-wrap:balance}
.tip-title .hl{color:var(--mint)}
.tip-body{margin-bottom:22px;font-size:15px;line-height:1.5;color:var(--mut);text-align:center;text-wrap:pretty}
.tip-btn{display:flex;justify-content:center;align-items:center;gap:10px;width:100%;min-height:58px;padding:18px;border:none;border-radius:15px;background:linear-gradient(180deg,var(--mint),var(--mint2));color:var(--ink);font-family:inherit;font-size:17px;font-weight:900;cursor:pointer;transition:transform .15s}
.tip-btn:active{transform:scale(.98)}
.tip-btn:disabled{cursor:default}
.tip-spin{width:18px;height:18px;border:2.5px solid rgba(4,35,26,.35);border-top-color:var(--ink);border-radius:50%;animation:tip-rot .7s linear infinite}
@keyframes tip-rot{100%{transform:rotate(360deg)}}

/* the reference's own small-phone rule */
@media (max-width:374px){
  .wrap{padding:18px 14px calc(24px + env(safe-area-inset-bottom,0px))}
  h1{font-size:27px}
  .q h2{font-size:20px}
  .est .big{font-size:34px}
  .stat b{font-size:14.5px}
  .stat span{font-size:9.5px}
  .cta{padding:16px;font-size:15px}
}
/* added here: the stat row and the estimate are the two things that get tight below 360px */
@media (max-width:360px){
  .stats{gap:7px}
  .stat{padding:11px 4px}
  .est .big{font-size:32px;letter-spacing:-1.2px}
  .opt{font-size:14px;padding:15px}
}
@media (max-width:344px){
  h1{font-size:25px}
  .est .big{font-size:29px}
  .stat b{font-size:13.5px}
  .brand .nm{font-size:17px}
}
/* added here: on a short screen the splash CTA has to stay above the fold */
@media (max-height:700px){
  .wrap{padding-top:16px}
  .brand{margin-bottom:14px}
  h1{font-size:28px;margin-bottom:10px}
  .sub{margin-bottom:16px}
  .stats{margin-bottom:16px}
  .sec-h{margin:20px 0 11px}
}
@media (prefers-reduced-motion:reduce){
  .anim{opacity:1}
}

    if (sent[ev]) return; sent[ev] = 1;
    try { (new Image()).src = url(ev) + '&_=' + Date.now(); } catch (e) {}
  }
  function beacon(ev) {
    if (sent[ev]) return; sent[ev] = 1;
    try {

    } catch (e) {}
  }
