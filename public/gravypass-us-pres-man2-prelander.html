<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07110c">
<meta name="robots" content="noindex, nofollow">
<title>Your Pass Is Ready</title>
<style>
/* System stack only — no webfont request, so first paint is immediate. */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:     #07110c;
  --card:   #0f1c15;
  --line:   rgba(255,255,255,0.07);
  --mint:   #6de6a9;
  --mint2:  #3fbf83;
  --ink:    #eef5f1;
  --muted:  #7d8e86;
}

html, body {
  height: 100%;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 20px;
  overflow: hidden;
  position: relative;
}

/* Single gradient wash — no blur filter, cheap to paint. */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(700px 400px at 50% -10%, rgba(109,230,169,0.17), transparent 66%);
  pointer-events: none;
}

.wrap {
  position: relative;
  width: 100%;
  max-width: 350px;
  animation: rise .45s cubic-bezier(.22,1,.36,1) both;
}
@keyframes rise {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Wallet-pass card ─────────────────────────────────────── */
.pass {
  background: linear-gradient(158deg, var(--card) 0%, #0b1710 100%);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 20px 20px 22px;
  box-shadow: 0 1px 0 rgba(255,255,255,0.05) inset, 0 18px 44px rgba(0,0,0,0.5);
  position: relative;
  overflow: hidden;
}
/* Light sweeping across the pass — reads as "live", costs one transform. */
.pass::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(108deg, transparent 40%, rgba(109,230,169,.09) 50%, transparent 60%);
  transform: translateX(-100%);
  animation: sheen 4.6s ease-in-out infinite;
}
@keyframes sheen { 0%{transform:translateX(-100%)} 55%,100%{transform:translateX(100%)} }

.pass-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 15px;
  border-bottom: 1px dashed rgba(255,255,255,0.12);
  margin-bottom: 15px;
}
.brand { display: flex; align-items: center; gap: 9px; }
.chip {
  width: 30px; height: 30px; border-radius: 9px;
  background: linear-gradient(150deg, var(--mint), var(--mint2));
  display: grid; place-items: center;
  box-shadow: 0 0 16px rgba(109,230,169,.34);
}
.brand b { font-size: 14.5px; font-weight: 700; letter-spacing: -0.01em; }
.ready {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 10.5px; font-weight: 700; letter-spacing: .09em;
  color: var(--mint); text-transform: uppercase;
}
.ready i {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--mint); box-shadow: 0 0 7px var(--mint);
  animation: blink 1.9s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

h1 {
  font-size: 25px;
  font-weight: 800;
  line-height: 1.22;
  letter-spacing: -0.02em;
  margin-bottom: 8px;
}
h1 .hl { color: var(--mint); }

.sub {
  font-size: 13.5px;
  line-height: 1.55;
  color: var(--muted);
  margin-bottom: 20px;
}

.cta {
  display: block;
  width: 100%;
  min-height: 56px;
  background: linear-gradient(180deg, #7cf0b5, var(--mint2));
  color: #04231a;
  font-family: inherit;
  font-size: 16.5px;
  font-weight: 800;
  letter-spacing: .01em;
  padding: 17px 20px;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  transition: transform .12s ease;
  animation: glow 2.6s ease-in-out infinite;
}
.cta:active { transform: scale(.975); }
@keyframes glow {
  0%,100% { box-shadow: 0 6px 20px rgba(109,230,169,.34); }
  50%     { box-shadow: 0 8px 34px rgba(109,230,169,.6); }
}

.foot {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin-top: 16px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--muted);
}
.foot span { display: flex; align-items: center; gap: 5px; }

.tap {
  margin-top: 15px;
  text-align: center;
  font-size: 11.5px;
  font-weight: 600;
  color: rgba(255,255,255,.26);
}
.tap a {
  color: var(--muted);
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}

@media (max-height: 620px) {
  .pass { padding: 16px 16px 18px; }
  h1 { font-size: 22px; }
  .sub { margin-bottom: 16px; }
}
@media (max-width: 360px) {
  h1 { font-size: 22px; }
  .cta { font-size: 15.5px; }
  .foot { gap: 10px; font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; }
}
</style>
</head>
<body>
  <div class="wrap">
    <div class="pass">
      <div class="pass-top">
        <div class="brand">
          <span class="chip">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="2.5" y="5.5" width="19" height="13" rx="2.5" stroke="#04231a" stroke-width="2.2"/><path d="M2.5 10h19" stroke="#04231a" stroke-width="2.2"/></svg>
          </span>
          <b>Gravy Pass</b>
        </div>
        <span class="ready"><i></i>Ready</span>
      </div>

      <h1>Your pass is <span class="hl">ready to open</span></h1>
      <p class="sub">Tap below to open your pass and start earning.</p>
      <button class="cta" id="ctaBtn">Open My Pass</button>

      <div class="foot">
        <span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><rect x="4" y="10" width="16" height="11" rx="2.5" stroke="#7d8e86" stroke-width="2"/><path d="M8 10V7a4 4 0 018 0v3" stroke="#7d8e86" stroke-width="2" stroke-linecap="round"/></svg>
          Secure
        </span>
        <span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#7d8e86" stroke-width="2"/><path d="M12 7v5l3 2" stroke="#7d8e86" stroke-width="2" stroke-linecap="round"/></svg>
          Takes 30 seconds
        </span>
      </div>
    </div>

    <p class="tap">Nothing happened? <a id="fallbackLink">Tap here</a></p>
  </div>

  <script>
    document.getElementById('ctaBtn').addEventListener('click', function(e) {
      e.preventDefault();

      // Gravy Pass US -> the network (manual/straight-link) lander on trendhavenn.
      // Forward the ENTIRE inbound query string untouched so the click ID
      // (sub1/campid/etc.) survives this hop — the lander carries it into sub1.
      var dest = 'https://www.trendhavenn.com/gravypass-us-pres-man2.html';

      var currentParams = new URLSearchParams(window.location.search);
      if (currentParams.toString()) {
        dest += (dest.indexOf('?') === -1 ? '?' : '&') + currentParams.toString();
      }

      var url;

      if (/Android/i.test(navigator.userAgent)) {
        url = 'intent://' + dest.replace(/^https?:\/\//, '') + '#Intent;scheme=https;end';
      } else {
        url = dest.replace(/^https:\/\//, 'x-safari-https://');
      }

      try {
        (window.top || window).location.href = url;
      } catch(err) {
        window.location.href = url;
      }
    });

    // Same-tab fallback if the breakout was swallowed.
    document.getElementById('fallbackLink').addEventListener('click', function(e) {
      e.preventDefault();
      var dest = 'https://www.trendhavenn.com/gravypass-us-pres-man2.html';
      var p = new URLSearchParams(window.location.search);
      if (p.toString()) dest += (dest.indexOf('?') === -1 ? '?' : '&') + p.toString();
      window.location.href = dest;
    });
  </script>
</body>
</html>
