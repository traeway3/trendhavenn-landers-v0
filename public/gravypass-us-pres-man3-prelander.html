<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, nofollow">
<title>Get Started</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

/* Same white page + one accent colour as the reference. The accent moves from purple to the
   Gravy Pass green: a deep mint (#0f9d63) carries the type and the button so it stays legible
   on white, while the lighter brand mint (#6de6a9) does the blobs and the glow. */
:root {
  --bg:       #ffffff;
  --green:    #0f9d63;
  --green-lt: #6de6a9;
  --ink:      #14211b;
  --muted:    #6b7a73;
  --cta-glow: rgba(15,157,99,0.32);
}

html, body {
  height: 100%;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px 24px;
  overflow: hidden;
  position: relative;
}

/* Two soft mint blobs behind everything, each breathing and drifting on a mirrored arc so the
   pair never moves in step. Fixed, behind the content, never interactive. */
body::before, body::after {
  content: '';
  position: fixed;
  width: 76vw;
  height: 76vw;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(109,230,169,0.42) 0%, rgba(63,191,131,0.15) 40%, rgba(109,230,169,0) 70%);
  filter: blur(20px);
  pointer-events: none;
  z-index: 0;
  will-change: transform, opacity;
}
body::before {
  top: -20vw; right: -24vw;
  animation: driftArc 17s ease-in-out infinite alternate, breathe 6.4s ease-in-out infinite;
}
body::after {
  bottom: -24vw; left: -26vw;
  animation: driftArcUp 21s ease-in-out infinite alternate, breathe 8s ease-in-out 2s infinite;
}
@keyframes driftArc {
  0%   { transform: translate(0, 0) scale(1); }
  30%  { transform: translate(-12vw, 11vh) scale(1.09); }
  65%  { transform: translate(4vw, 24vh) scale(1); }
  100% { transform: translate(-6vw, 36vh) scale(1.05); }
}
@keyframes driftArcUp {
  0%   { transform: translate(0, 0) scale(1); }
  30%  { transform: translate(12vw, -11vh) scale(1.09); }
  65%  { transform: translate(-4vw, -24vh) scale(1); }
  100% { transform: translate(6vw, -36vh) scale(1.05); }
}
@keyframes breathe {
  0%, 100% { opacity: 0.52; }
  50%      { opacity: 1; }
}

.ask {
  position: relative;
  z-index: 1;
  max-width: 400px;
  width: 100%;
  animation: fadeUp .5s ease both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

.ask-card { text-align: center; }

/* Small brand mark above the headline — ties the prelander to the lander it hands off to. */
.ask-mark {
  width: 54px; height: 54px;
  border-radius: 16px;
  display: block;
  margin: 0 auto 18px;
  box-shadow: 0 6px 20px rgba(15,157,99,0.22);
  animation: markFloat 4.2s ease-in-out infinite;
}
@keyframes markFloat {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-5px); }
}

.ask-title {
  font-size: 32px;
  font-weight: 900;
  line-height: 1;
  letter-spacing: -1.1px;
  margin: 0;
  color: var(--green);
}

.ask-btn {
  display: block;
  width: 100%;
  font-family: inherit;
  font-size: 16px;
  font-weight: 900;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  padding: 19px 24px;
  border-radius: 14px;
  border: none;
  text-align: center;
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
  transition: transform 0.1s ease, opacity 0.2s ease;
}
.ask-btn:active { transform: scale(0.97); }

.ask-cta {
  margin-top: 34px;
  background: linear-gradient(180deg, #17b374, var(--green));
  color: #ffffff;
  animation: ctaPulse 2.5s ease-in-out infinite;
}
.ask-cta:disabled { animation: none; opacity: 0.7; cursor: default; box-shadow: 0 6px 18px rgba(15,157,99,0.24); }
@keyframes ctaPulse {
  0%, 100% { box-shadow: 0 0 30px var(--cta-glow), 0 6px 18px rgba(15,157,99,0.24); }
  50%      { box-shadow: 0 0 52px var(--cta-glow), 0 6px 18px rgba(15,157,99,0.24); }
}

/* Two reassurance lines under the button. */
.ask-points {
  list-style: none;
  margin: 16px -6px 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 8px 14px;
}
.ask-points li {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: -0.1px;
  color: var(--muted);
  line-height: 1.2;
  white-space: nowrap;
}
.ask-points svg { width: 15px; height: 15px; color: var(--green); flex-shrink: 0; }

/* The watchdog's fallback line. Empty — and so hidden — until the script fills it. */
.sub { display: none; margin-top: 18px; font-size: 13px; font-weight: 600; color: var(--muted); line-height: 1.5; }
.sub:not(:empty) { display: block; }
.sub b { color: var(--ink); }

@media (max-height: 640px) {
  .ask-mark { width: 46px; height: 46px; margin-bottom: 14px; }
  .ask-title { font-size: 28px; }
  .ask-cta { margin-top: 26px; }
  .ask-points { margin-top: 12px; }
}
@supports (padding-bottom: env(safe-area-inset-bottom)) {
  body { padding-bottom: calc(28px + env(safe-area-inset-bottom)); }
}

/* The looping animations start off their default state, so suppressing motion has to restore
   that state explicitly or the page renders wrong rather than merely still. */
@media (prefers-reduced-motion: reduce) {
  .ask { animation: none; opacity: 1; transform: none; }
  .ask-mark { animation: none; }
  body::before, body::after { animation: none; opacity: 0.72; }
  .ask-cta { animation: none; box-shadow: 0 6px 18px rgba(15,157,99,0.24); }
  .ask-btn { transition: none; }
}
</style>
</head>

      <h1 class="ask-title">Begin Below</h1>
      <button type="button" class="ask-btn ask-cta" id="ctaBtn">Continue</button>
      <ul class="ask-points">
        <li>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2.5" stroke="currentColor" stroke-width="2"/><path d="M8 10V7a4 4 0 018 0v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Secure connection
        </li>
        <li>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Takes 30 seconds
        </li>
      </ul>
      <p class="sub" id="subLine"></p>
    </div>
  </div>

  <script>
  (function () {
    'use strict';
    var btn = document.getElementById('ctaBtn');
    var sub = document.getElementById('subLine');
    if (!btn) return;

    // Gravy Pass US -> the network (manual/straight-link) lander on trendhavenn.
    var DEST = 'https://www.trendhavenn.com/gravypass-us-pres-man3.html';

    function subid() {
      var p = new URLSearchParams(window.location.search);
      return p.get('campid') || p.get('sub1') || p.get('s1') ||
             p.get('s2') || p.get('cid') || p.get('c') || '';
    }

    // Forward the ENTIRE inbound query string untouched so the click ID survives this hop —
    // the lander is what carries it into sub1.
    function dest() {
      var q = new URLSearchParams(window.location.search).toString();
      return q ? DEST + (DEST.indexOf('?') === -1 ? '?' : '&') + q : DEST;
    }

    // ---- beacon: guarded so each event fires once ----
    var PAGE = 'gp-m3-pre', sent = {};
    function px(ev) {
      if (sent[ev]) return; sent[ev] = 1;
      try {
        var u = 'https://px.trendhavenn.com/t?e=' + encodeURIComponent(ev) +
                '&id=' + encodeURIComponent(subid()) + '&p=' + PAGE;
        if (navigator.sendBeacon) navigator.sendBeacon(u); else new Image().src = u;
      } catch (e) {}
    }
    px('load');
    ['scroll', 'touchstart', 'mousemove'].forEach(function (t) {
      window.addEventListener(t, function () { px('human'); }, { once: true, passive: true });
    });

    var tried = false;

    function go() {
      px('continue');
      var d = dest(), url;

      if (/Android/i.test(navigator.userAgent)) {
        url = 'intent://' + d.replace(/^https?:\/\//, '') + '#Intent;scheme=https;end';
      } else {
        url = d.replace(/^https:\/\//, 'x-safari-https://');
      }

      try {
        (window.top || window).location.href = url;
      } catch (err) {
        window.location.href = url;
      }
    }

    // Watchdog: if the hand-off was swallowed the page is still here ~1.6s later, so re-enable
    // the same button as a plain same-tab continue. Nothing fires on load.
    function watchdog() {
      btn.disabled = false;
      btn.textContent = 'Continue anyway';
      sub.innerHTML = 'Still here? <b>Tap continue anyway</b> to keep going.';
      btn.onclick = function () {
        px('fallback');
        window.location.href = dest();
      };
    }

    btn.addEventListener('click', function () {
      if (tried) return;
      tried = true;
      btn.disabled = true;
      go();
      setTimeout(watchdog, 1600);
    });
  })();
  </script>
