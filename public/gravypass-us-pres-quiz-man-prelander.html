<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0f0d">
<meta name="robots" content="noindex, nofollow">
<title>Continue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --bg: #0b0f0d;
        --card: #141a18;
        --border: rgba(255,255,255,0.06);
        --accent: #6de6a9;
        --accent-dim: rgba(109,230,169,0.15);
        --accent-glow: rgba(109,230,169,0.4);
        --text: #f2f5f3;
        --muted: #6f7a75;
        --muted2: #8b9a93;
    }

    html, body {
        height: 100%;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px 24px;
        overflow: hidden;
        position: relative;
    }

    body::before {
        content: '';
        position: fixed;
        inset: 0;
        background:
            radial-gradient(ellipse 60% 40% at 50% 0%, rgba(109,230,169,0.13) 0%, transparent 65%),
            radial-gradient(ellipse 40% 30% at 100% 100%, rgba(63,191,131,0.06) 0%, transparent 60%);
        pointer-events: none;
        z-index: 0;
    }

    .wrap {
        position: relative;
        z-index: 1;
        max-width: 400px;
        width: 100%;
        text-align: center;
        animation: fadeUp .5s ease both;
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .icon-wrap {
        width: 88px;
        height: 88px;
        margin: 0 auto 28px;
        border-radius: 22px;
        border: 1px solid rgba(109,230,169,0.25);
        background: var(--accent-dim);
        display: grid;
        place-items: center;
        animation: iconGlow 3s ease-in-out infinite;
    }

    @keyframes iconGlow {
        0%, 100% { box-shadow: 0 0 30px rgba(109,230,169,0.2); }
        50%       { box-shadow: 0 0 60px rgba(109,230,169,0.4); }
    }

    .icon-wrap svg {
        width: 36px;
        height: 36px;
        color: var(--accent);
        stroke-width: 2.5;
    }

    h1 {
        font-family: "Inter", sans-serif;
        font-size: 44px;
        font-weight: 900;
        line-height: 1.04;
        letter-spacing: -1.5px;
        margin-bottom: 12px;
        color: var(--text);
    }

    h1 .hl { color: var(--accent); }

    .sub {
        font-size: 14px;
        font-weight: 700;
        color: var(--muted2);
        line-height: 1.55;
        margin-bottom: 36px;
    }

    .cta {
        display: block;
        width: 100%;
        min-height: 60px;
        background: var(--accent);
        color: #04231a;
        font-family: "Inter", sans-serif;
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 0.3px;
        text-transform: uppercase;
        padding: 18px 24px;
        border-radius: 14px;
        border: none;
        cursor: pointer;
        margin-bottom: 18px;
        transition: transform 0.1s ease;
        animation: ctaPulse 2.5s ease-in-out infinite;
    }

    .cta:active { transform: scale(0.97); }

    @keyframes ctaPulse {
        0%, 100% { box-shadow: 0 0 40px var(--accent-glow), 0 4px 20px rgba(0,0,0,0.4); }
        50%       { box-shadow: 0 0 70px var(--accent-glow), 0 4px 20px rgba(0,0,0,0.4); }
    }

    .fallback {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        letter-spacing: 0.2px;
    }
    .fallback a {
        color: var(--muted2);
        text-decoration: underline;
        text-underline-offset: 3px;
        cursor: pointer;
    }

    @media (max-height: 640px) {
        .icon-wrap { width: 70px; height: 70px; margin-bottom: 20px; }
        .icon-wrap svg { width: 28px; height: 28px; }
        h1 { font-size: 36px; }
        .sub { margin-bottom: 24px; }
    }

    @media (max-width: 374px) {
        h1 { font-size: 38px; }
        .cta { font-size: 16px; padding: 16px 18px; }
    }

    @supports (padding-bottom: env(safe-area-inset-bottom)) {
        body { padding-bottom: calc(28px + env(safe-area-inset-bottom)); }
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
    }
</style>
</head>
<body>
    <div class="wrap">
        <div class="icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14"></path>
                <path d="M13 6l6 6-6 6"></path>
            </svg>
        </div>
        <h1>Let's <span class="hl">Get Started</span></h1>
        <p class="sub">Tap continue to load your rewards page.</p>
        <button class="cta" id="ctaBtn">Continue</button>
        <p class="fallback">Nothing happened? <a id="fallbackLink">Tap here</a></p>
    </div>

    <script>
        (function(){
            var QP = new URLSearchParams(window.location.search);
            function subid(){
                return QP.get('sub1') || QP.get('campid') || QP.get('s1')
                    || QP.get('s2')   || QP.get('cid')    || QP.get('c') || '';
            }

            /* Tracking beacon — first-party, px.trendhavenn.com. Same event names as the
               lander so the two rows line up in the dashboard and drop-off is readable. */
            var TRACK = 'https://px.trendhavenn.com/t', PAGE = 'gp-quiz-pre';
            function hit(ev){
                try { new Image().src = TRACK+'?e='+ev+'&id='+encodeURIComponent(subid())+'&p='+PAGE+'&_='+Date.now(); } catch(e){}
            }
            function hitBeacon(ev){
                try {
                    var u = TRACK+'?e='+ev+'&id='+encodeURIComponent(subid())+'&p='+PAGE;
                    if (navigator.sendBeacon) { navigator.sendBeacon(u); } else { new Image().src = u+'&_='+Date.now(); }
                } catch(e){}
            }
            hit('load');
            var human = false;
            function fireHuman(){ if(human) return; human = true; hit('human'); }
            ['scroll','touchstart','pointerdown','mousemove','keydown'].forEach(function(e){
                window.addEventListener(e, fireHuman, {once:true, passive:true});
            });

            /* Forward the ENTIRE inbound query string untouched so the click ID survives
               this hop under whatever name the ad used. */
            function buildDest(){
                var dest = 'https://www.trendhavenn.com/gravypass-us-pres-quiz-man.html';
                var p = new URLSearchParams(window.location.search);
                if (p.toString()) dest += (dest.indexOf('?') === -1 ? '?' : '&') + p.toString();
                return dest;
            }

            function go(e){
                if (e) e.preventDefault();
                hitBeacon('continue');
                var dest = buildDest();
                var url = /Android/i.test(navigator.userAgent)
                        ? 'intent://' + dest.replace(/^https?:\/\//, '') + '#Intent;scheme=https;end'
                        : dest.replace(/^https:\/\//, 'x-safari-https://');
                try { (window.top || window).location.href = url; }
                catch(err) { window.location.href = url; }
            }

            document.getElementById('ctaBtn').addEventListener('click', go);

            /* Fallback — if the breakout was swallowed, this stays in the webview rather
               than stranding the user on a page that looks broken. */
            document.getElementById('fallbackLink').addEventListener('click', function(e){
                e.preventDefault();
                hitBeacon('fallback');
                window.location.href = buildDest();
            });
        })();
    </script>
</body>
</html>
