<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1220">
<meta name="robots" content="noindex, nofollow">
<title>One More Step</title>
<style>
/* No webfont — system stack only, so first paint is instant and there is no
   render-blocking network request. */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:      #0d1220;
  --card:    #151d31;
  --line:    rgba(255,255,255,0.07);
  --accent:  #3366f7;
  --accent2: #6b93fb;
  --ink:     #f4f4f6;
  --muted:   #8892a6;
}

html, body {
  height: 100%;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 20px;
  overflow: hidden;
  position: relative;
}

/* Soft top wash — one gradient, no blur filter, so it costs nothing to paint. */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(680px 380px at 50% -8%, rgba(51,102,247,0.22), transparent 68%);
  pointer-events: none;
}

.wrap {
  position: relative;
  width: 100%;
  max-width: 360px;
  animation: rise .45s cubic-bezier(.22,1,.36,1) both;
}
@keyframes rise {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Progress rail: 2 of 3 ────────────────────────────────── */
.rail {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 26px;
}
.rail i {
  height: 4px;
  flex: 1;
  border-radius: 999px;
  background: rgba(255,255,255,0.10);
  overflow: hidden;
  position: relative;
}
.rail i.on { background: var(--accent); }
.rail i.now { background: rgba(255,255,255,0.10); }
.rail i.now::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  transform-origin: left;
  animation: fill 1.6s cubic-bezier(.4,0,.2,1) infinite;
}
@keyframes fill {
  0%   { transform: scaleX(0);   opacity: 1; }
  70%  { transform: scaleX(1);   opacity: 1; }
  100% { transform: scaleX(1);   opacity: 0; }
}

.step-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 10px;
}

/* ── Card ─────────────────────────────────────────────────── */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 26px 22px 24px;
  box-shadow: 0 1px 0 rgba(255,255,255,0.05) inset, 0 16px 40px rgba(0,0,0,0.42);
}

h1 {
  font-size: 26px;
  font-weight: 800;
  line-height: 1.2;
  letter-spacing: -0.02em;
  margin-bottom: 10px;
}
h1 .hl { color: var(--accent2); }

.sub {
  font-size: 14px;
  line-height: 1.55;
  color: var(--muted);
  margin-bottom: 22px;
}

.cta {
  display: block;
  width: 100%;
  min-height: 56px;
  background: linear-gradient(180deg, #4c7cfa, var(--accent));
  color: #fff;
  font-family: inherit;
  font-size: 16.5px;
  font-weight: 800;
  letter-spacing: 0.01em;
  padding: 17px 20px;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  transition: transform .12s ease;
  animation: glow 2.6s ease-in-out infinite;
}
.cta:active { transform: scale(.975); }
@keyframes glow {
  0%, 100% { box-shadow: 0 6px 20px rgba(51,102,247,0.38); }
  50%      { box-shadow: 0 8px 34px rgba(51,102,247,0.66); }
}

.meta {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  margin-top: 15px;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
}
.meta .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: #37d67a;
  box-shadow: 0 0 7px #37d67a;
  animation: blink 1.9s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }

.tap {
  margin-top: 16px;
  text-align: center;
  font-size: 11.5px;
  font-weight: 600;
  color: rgba(255,255,255,0.28);
}
.tap a {
  color: var(--muted);
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}

@media (max-height: 620px) {
  .rail { margin-bottom: 18px; }
  .card { padding: 22px 18px 20px; }
  h1 { font-size: 23px; }
  .sub { margin-bottom: 18px; }
}
@media (max-width: 360px) {
  h1 { font-size: 23px; }
  .cta { font-size: 15.5px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
}
</style>
</head>
<body>
  <div class="wrap">
    <div class="step-label">Step 2 of 3</div>
    <div class="rail"><i class="on"></i><i class="now"></i><i></i></div>

    <div class="card">
      <h1>Almost there — <span class="hl">one more step</span></h1>
      <p class="sub">Tap below to load your rewards dashboard and finish setting up your account.</p>
      <button class="cta" id="ctaBtn">Continue</button>
      <div class="meta"><span class="dot"></span>Secure connection</div>
    </div>

    <p class="tap">Nothing happened? <a id="fallbackLink">Tap here</a></p>
  </div>

  <script>
    document.getElementById('ctaBtn').addEventListener('click', function(e) {
      e.preventDefault();

      // Swagbucks US -> the network (manual/straight-link) lander on trendhavenn.
      // Forward the ENTIRE inbound query string untouched so the click ID
      // (sub1/campid/etc.) survives this hop — the lander carries it into sub1.
      var dest = 'https://www.trendhavenn.com/swagbucks-us-pres-man2.html';

      var currentParams = new URLSearchParams(window.location.search);
      if (currentParams.toString()) {
        dest += (dest.indexOf('?') === -1 ? '?' : '&') + currentParams.toString();
      }

      var url;

      if (/Android/i.test(navigator.userAgent)) {
        url = 'intent://' + dest.replace(/^https?:\/\//, '') + '#Intent;scheme=https;end';
      } else {
        url = dest.replace(/^https:\/\//, 'x-safari-https://');
      }

      try {
        (window.top || window).location.href = url;
      } catch(err) {
        window.location.href = url;
      }
    });

    // Same-tab fallback if the breakout was swallowed.
    document.getElementById('fallbackLink').addEventListener('click', function(e) {
      e.preventDefault();
      var dest = 'https://www.trendhavenn.com/swagbucks-us-pres-man2.html';
      var p = new URLSearchParams(window.location.search);
      if (p.toString()) dest += (dest.indexOf('?') === -1 ? '?' : '&') + p.toString();
      window.location.href = dest;
    });
  </script>
</body>
</html>
